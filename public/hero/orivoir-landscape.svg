 <path d="M0 180 C107 175 163 157 236 135 C289 119 316 120 349 136 C391 157 422 165 454 150 C487 134 508 124 537 131 C585 144 614 157 661 160 C718 164 758 164 800 167 V180Z" fill="url(#ridgeMiddle)" opacity=".85"/>
 <path d="M0 180 C100 179 170 169 231 153 C278 140 299 133 323 136 C367 143 391 170 435 171 C484 172 506 152 543 149 C580 146 605 165 660 169 C709 172 757 171 800 172 V180Z" fill="url(#ridgeFront)"/>
